<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime Navigator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Uptime Navigator</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="submitters" type="button">Submitters</button>
      <button class="tab" data-tab="leaderboard" type="button">Leaderboard</button>
    </nav>
    <div class="meta">
      <span id="submitter-count">—</span> submitters &middot;
      refreshed <span id="refreshed">—</span>
      <button id="refresh" type="button">Refresh</button>
      <button id="export-csv" type="button" title="Download submitters.csv and leaderboard.csv">Export CSV</button>
    </div>
  </header>

  <main>
    <section id="list">
      <table id="submitters">
        <thead>
          <tr>
            <th data-sort="submitter">Submitter</th>
            <th data-sort="submissions" class="num">Submissions</th>
            <th data-sort="chain_verified" class="num" title="Submissions confirmed by a canonical block near the submission time">On chain</th>
            <th data-sort="chain_rejected" class="num" title="Submissions with no canonical block in the matching window">Off chain</th>
            <th data-sort="chain_pending" class="num" title="Awaiting the next verifier run">Pending</th>
            <th data-sort="blocks_produced" class="num" title="Submissions where a canonical block in the window was created by the submitter">Self-produced</th>
            <th data-sort="last_seen">Last seen</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="empty" hidden>No submissions yet.</p>
      <p id="error" hidden></p>
    </section>

    <section id="leaderboard-view" hidden>
      <div class="leaderboard-controls">
        <label>Window (days)
          <input id="lb-uptime-days" type="number" min="1" max="365" value="90">
        </label>
        <label>Survey interval (min)
          <input id="lb-survey-min" type="number" min="1" max="1440" value="20">
        </label>
        <label>
          <input id="lb-require-verified" type="checkbox" checked>
          Require verified
        </label>
        <button id="lb-reload" type="button">Apply</button>
        <span id="lb-meta" class="muted"></span>
      </div>
      <table id="leaderboard">
        <thead>
          <tr>
            <th>#</th>
            <th data-sort="block_producer_key">Block producer</th>
            <th data-sort="score" class="num">Score</th>
            <th data-sort="score_percent" class="num">Score %</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="lb-empty" hidden>No scored block producers yet.</p>
      <p id="lb-error" hidden></p>
    </section>

    <section id="detail" hidden>
      <button id="back" type="button">&laquo; Back</button>
      <h2><code id="detail-pubkey"></code></h2>
      <div id="uptime-summary" class="summary"></div>
      <canvas id="uptime-sparkline" width="600" height="60" aria-label="Submission coverage over the last 24 hours"></canvas>
      <h3>Recent submissions</h3>
      <table id="detail-rows">
        <thead>
          <tr>
            <th>Submitted at</th>
            <th>Block hash</th>
            <th title="From chain cross-validation">Verified</th>
            <th>Block creator</th>
            <th>Validation error</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/csv.js"></script>
  <script src="/app.js"></script>
</body>
</html>
